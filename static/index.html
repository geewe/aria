<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aria 家庭助手</title>
<style>
/* ═══ RESET ═══ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ═══ VARIABLES ═══ */
:root {
    --bg-deep: #14161c;
    --bg-surface: #20222a;
    --glass: rgba(126,212,204,0.03);
    --glass-strong: rgba(126,212,204,0.06);
    --glass-border: rgba(126,212,204,0.05);
    --text-primary: rgba(238,240,242,0.9);
    --text-secondary: rgba(238,240,242,0.35);
    --text-dim: rgba(238,240,242,0.1);
    --accent: rgba(126,212,204,0.45);
    --accent-soft: rgba(126,212,204,0.06);
    --glow: rgba(126,212,204,0.03);
    --radius: 16px;
    --font: -apple-system,'SF Pro Text','Inter',system-ui,sans-serif;
}

html,body{height:100%;overflow:hidden;background:var(--bg-deep);color:var(--text-primary);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none}

/* ═══ AMBIENT BACKGROUND ═══ */
#scene{
    position:fixed;inset:0;z-index:0;
    background:
        radial-gradient(ellipse 70% 40% at 50% 20%,rgba(30,60,80,0.2) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 85%,rgba(10,40,55,0.12) 0%,transparent 55%),
        var(--bg-deep);
}

/* ═══ ORB — 中心环境光 ═══ */
#orb-container{
    position:fixed;z-index:1;
    bottom:160px;left:50%;transform:translateX(-50%);
    width:200px;height:200px;pointer-events:none;
    transition:opacity 1.5s cubic-bezier(0.4,0,0.2,1);
}
#orb{
    position:absolute;inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 45% 40%,rgb(126,212,204,0.06) 0%,rgba(116,200,192,0.02) 30%,transparent 70%);
    filter:blur(8px);
    transition:all 2s cubic-bezier(0.4,0,0.2,1);
    animation:orbBreathe 5s ease-in-out infinite;
}
@keyframes orbBreathe{
    0%,100%{transform:scale(1);opacity:0.6}
    50%{transform:scale(1.05);opacity:1}
}
#orb-container.listening #orb{
    background:radial-gradient(circle at 40% 35%,rgb(130,216,208,0.12) 0%,rgba(120,204,196,0.04) 25%,transparent 65%);
    animation:orbBreathe 2.5s ease-in-out infinite;
    filter:blur(12px);
}
#orb-container.thinking #orb{
    background:radial-gradient(circle at 50% 50%,rgb(132,218,210,0.16) 0%,rgba(122,206,198,0.05) 20%,transparent 60%);
    animation:orbPulse 1.2s ease-in-out infinite;
    filter:blur(15px);
}
@keyframes orbPulse{
    0%,100%{transform:scale(1);opacity:0.8}
    50%{transform:scale(1.15);opacity:1}
}
#orb-container.speaking #orb{
    background:radial-gradient(circle at 40% 35%,rgb(126,212,204,0.1) 0%,rgba(116,200,192,0.03) 35%,transparent 70%);
    animation:orbSpeak 0.8s ease-in-out infinite;
    filter:blur(10px);
}
@keyframes orbSpeak{
    0%,100%{transform:scale(1) translateY(0);opacity:0.8}
    25%{transform:scale(1.03) translateY(-2px);opacity:0.9}
    75%{transform:scale(0.98) translateY(1px);opacity:0.7}
}
#orb-container.idle{
    opacity:0.5;bottom:80px;
}

/* ═══ PARTICLES — 只有点, 没有线 ═══ */
#particles{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.p{
    position:absolute;bottom:-2px;
    width:1px;height:1px;
    background:rgba(220,218,245,0.04);
    border-radius:50%;
    animation:pRise linear infinite;
}
@keyframes pRise{
    0%{transform:translateY(0) scale(0);opacity:0}
    5%{opacity:1}
    90%{opacity:0.3}
    100%{transform:translateY(-100vh) scale(0.5);opacity:0}
}

/* ═══ STATUS — 极简连接指示 ═══ */
#status{
    position:fixed;z-index:10;
    top:env(safe-area-inset-top,16px);left:24px;
    display:flex;align-items:center;gap:6px;
    font-size:10px;letter-spacing:0.8px;font-weight:400;
    color:var(--text-dim);opacity:0;transition:opacity 0.8s;
}
#status.always{opacity:0.35}
#status.visible{opacity:1}
#status-dot{
    width:3px;height:3px;border-radius:50%;
    background:rgba(126,212,204,0.5);transition:all 1s;
}
#status-dot.online{background:rgba(126,212,204,0.7);box-shadow:0 0 6px rgba(126,212,204,0.2)}
#status-dot.offline{background:rgba(255,255,255,0.06)}
#ha-status{
    font-size:9px;letter-spacing:0.5px;font-weight:400;
    color:var(--text-dim);margin-left:2px;
    transition:all 0.5s;
}
#ha-status.online{color:rgba(126,212,204,0.5)}
#ha-status.offline{color:var(--text-dim)}

/* ═══ TIME ═══ */
#time{
    position:fixed;z-index:10;
    top:env(safe-area-inset-top,16px);right:24px;
    font-size:10px;letter-spacing:0.8px;font-weight:400;
    color:var(--text-dim);opacity:0;transition:opacity 1s;
    font-variant-numeric:tabular-nums;
}
#time.visible{opacity:1}

/* ═══ CHAT — 浮动玻璃面板 ═══ */
#chat{
    position:fixed;z-index:2;
    left:0;right:0;
    bottom:230px;
    max-height:calc(100vh - 240px);
    overflow-y:auto;
    padding:40px 32px 0;
    display:flex;flex-direction:column;
    gap:8px;
    scroll-behavior:smooth;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 60px,black 90%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0%,black 60px,black 90%,transparent 100%);
}
#chat::-webkit-scrollbar{width:0}

.msg{
    max-width:520px;
    animation:msgIn 0.6s cubic-bezier(0.16,1,0.3,1);
    transform-origin:bottom;
}
@keyframes msgIn{
    from{opacity:0;transform:translateY(12px) scale(0.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

.msg-inner{
    padding:12px 16px;
    border-radius:var(--radius);
    font-size:15px;line-height:1.7;
    font-weight:350;letter-spacing:0.3px;
    backdrop-filter:blur(40px);
    -webkit-backdrop-filter:blur(40px);
    transition:all 0.4s;
}

.msg.user{
    align-self:flex-end;
}
.msg.user .msg-inner{
    background:linear-gradient(135deg,rgba(126,212,204,0.04) 0%,rgba(116,200,192,0.02) 100%);
    border:1px solid rgba(126,212,204,0.06);
    color:var(--text-primary);
    border-bottom-right-radius:4px;
}
.msg.bot{
    align-self:flex-start;
}
.msg.bot .msg-inner{
    background:linear-gradient(135deg,rgba(126,212,204,0.02) 0%,rgba(116,200,192,0.01) 100%);
    border:1px solid rgba(126,212,204,0.04);
    color:var(--text-secondary);
    border-bottom-left-radius:4px;
}

.msg .label{
    font-size:9px;letter-spacing:1.5px;font-weight:500;
    text-transform:uppercase;margin-bottom:4px;opacity:0.3;
    transition:opacity 0.3s;
}
.msg.user .label{color:rgba(126,212,204,0.6)}
.msg.bot .label{color:rgba(126,212,204,0.3)}
.msg-inner:hover .label{opacity:0.6}

.msg.info{
    align-self:center;
    font-size:10px;color:var(--text-dim);
    letter-spacing:0.5px;padding:4px 12px;
    border-radius:20px;
    background:rgba(126,212,204,0.03);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    animation:msgIn 0.4s cubic-bezier(0.16,1,0.3,1);
}

.typing{
    align-self:flex-start;
    padding:12px 16px;
}
.typing .msg-inner{
    display:flex;gap:4px;align-items:center;
    background:linear-gradient(135deg,rgba(126,212,204,0.02) 0%,rgba(116,200,192,0.01) 100%);
    border:1px solid rgba(126,212,204,0.04);
    backdrop-filter:blur(40px);
    -webkit-backdrop-filter:blur(40px);
    padding:14px 20px;
    border-bottom-left-radius:4px;
}
.typing span{
    width:4px;height:4px;border-radius:50%;
    background:var(--text-secondary);
    animation:dotB 1.4s ease-in-out infinite;
}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes dotB{
    0%,80%,100%{opacity:0.15;transform:scale(0.8)}
    40%{opacity:0.6;transform:scale(1)}
}

/* ═══ VOICE METER ═══ */
#meter{
    position:fixed;z-index:2;
    bottom:185px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;justify-content:center;
    gap:2px;height:24px;
    opacity:0;transition:opacity 0.4s;pointer-events:none;
}
#meter.active{opacity:1}
#meter .bar{
    width:2px;border-radius:1px;
    background:rgba(126,212,204,0.35);
    transition:all 0.08s ease;
    min-height:2px;
}

/* ═══ MIC — 大号居中 ═══ */
#mic-wrap{
    position:fixed;z-index:6;
    bottom:calc(env(safe-area-inset-bottom,0) + 92px);
    left:50%;transform:translateX(-50%);
    display:flex;align-items:center;justify-content:center;
    transition:opacity 0.5s,transform 0.5s;
}

#mic-btn{
    width:72px;height:72px;border-radius:50%;
    border:1.5px solid rgba(126,212,204,0.2);
    background:rgba(32,34,42,0.6);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    color:rgba(126,212,204,0.5);
    font-size:24px;line-height:1;
    cursor:pointer;
    transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;
    position:relative;z-index:2;
    animation:micIdle 3s ease-in-out infinite;
}
@keyframes micIdle{
    0%,100%{box-shadow:0 0 0 0 rgba(126,212,204,0),0 8px 32px rgba(126,212,204,0.06)}
    50%{box-shadow:0 0 0 8px rgba(126,212,204,0.04),0 8px 40px rgba(126,212,204,0.1)}
}
#mic-btn:hover{
    border-color:rgba(126,212,204,0.35);
    color:rgba(126,212,204,0.7);
    box-shadow:0 0 0 4px rgba(126,212,204,0.06),0 12px 48px rgba(126,212,204,0.1);
    animation:none;
    transform:scale(1.03);
}
#mic-btn.recording{
    border-color:rgba(126,212,204,0.5);
    color:rgba(126,212,204,0.85);
    box-shadow:0 0 0 12px rgba(126,212,204,0.08),0 0 60px rgba(126,212,204,0.12);
    animation:micRec 1.2s ease-in-out infinite;
}
@keyframes micRec{
    0%,100%{box-shadow:0 0 0 8px rgba(126,212,204,0.06),0 0 50px rgba(126,212,204,0.1)}
    50%{box-shadow:0 0 0 16px rgba(126,212,204,0.1),0 0 70px rgba(126,212,204,0.15)}
}

#mic-ring{
    position:absolute;z-index:1;
    width:90px;height:90px;border-radius:50%;
    border:1px solid rgba(126,212,204,0.08);
    animation:ringPulse 3s ease-in-out infinite;
    pointer-events:none;
}
@keyframes ringPulse{
    0%,100%{transform:scale(1);opacity:0.4}
    50%{transform:scale(1.08);opacity:0.15}
}
#mic-btn.recording ~ #mic-ring{
    animation:ringRec 1.2s ease-in-out infinite;
    border-color:rgba(126,212,204,0.15);
}
@keyframes ringRec{
    0%,100%{transform:scale(1);opacity:0.3}
    50%{transform:scale(1.15);opacity:0.1}
}

/* ═══ DIAGNOSTICS PANEL ═══ */
#diag-btn{
    background:none;border:none;
    color:var(--accent);font-size:14px;cursor:pointer;
    padding:2px 2px 2px 4px;
    opacity:0.6;transition:all 0.3s;line-height:1;
    position:relative;
}
#diag-btn:hover{opacity:1;color:rgba(126,212,204,0.9);text-shadow:0 0 8px rgba(126,212,204,0.2)}
#diag-panel{
    position:fixed;z-index:100;
    top:50%;left:50%;transform:translate(-50%,-50%) scale(0.95);
    width:520px;max-width:92vw;max-height:80vh;
    background:rgba(15,18,25,0.96);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    display:none;flex-direction:column;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    overflow:hidden;
}
#diag-panel.open{display:flex;animation:diagFadeIn 0.2s ease}
@keyframes diagFadeIn{
    from{opacity:0;transform:translate(-50%,-50%) scale(0.92)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
#diag-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.06);
    font-size:13px;font-weight:500;letter-spacing:0.5px;
    color:var(--text-primary);
}
#diag-close{
    background:none;border:none;color:var(--text-dim);
    font-size:14px;cursor:pointer;padding:4px 8px;border-radius:6px;
    transition:all 0.2s;
}
#diag-close:hover{color:var(--text-primary);background:rgba(255,255,255,0.06)}
#diag-summary{
    padding:10px 18px;
    border-bottom:1px solid rgba(255,255,255,0.04);
}
#diag-summary-text{
    font-size:11px;color:var(--text-secondary);
}
#diag-results{
    flex:1;overflow-y:auto;padding:6px 0;
}
.diag-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:8px 18px;font-size:12px;
    border-bottom:1px solid rgba(255,255,255,0.02);
    transition:background 0.2s;
}
.diag-item:hover{background:rgba(255,255,255,0.02)}
.diag-icon{
    width:18px;text-align:center;flex-shrink:0;
    font-size:11px;margin-top:1px;
}
.diag-icon.ok{color:rgba(126,212,204,0.8)}
.diag-icon.warn{color:rgba(255,213,79,0.8)}
.diag-icon.error{color:rgba(255,107,107,0.8)}
.diag-icon.skip{color:var(--text-dim)}
.diag-body{flex:1;min-width:0}
.diag-name{color:var(--text-primary);font-weight:500;margin-bottom:1px}
.diag-msg{color:var(--text-secondary);font-size:11px;line-height:1.4}
.diag-time{
    font-size:10px;color:var(--text-dim);
    opacity:0.4;flex-shrink:0;margin-left:8px;
}
#diag-actions{
    display:flex;gap:6px;padding:10px 18px;
    border-top:1px solid rgba(255,255,255,0.06);
}
#diag-actions button{
    flex:1;padding:8px 16px;border:1px solid rgba(255,255,255,0.08);
    border-radius:8px;background:rgba(255,255,255,0.04);
    color:var(--text-primary);font-size:11px;cursor:pointer;
    transition:all 0.2s;letter-spacing:0.3px;
}
#diag-actions button:hover{
    background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15);
}
#diag-actions button:active{transform:scale(0.97)}
#diag-actions button.primary{
    background:rgba(126,212,204,0.1);
    border-color:rgba(126,212,204,0.2);
    color:rgba(126,212,204,0.9);
}
#diag-actions button.primary:hover{
    background:rgba(126,212,204,0.18);
}

/* ═══ INPUT — 文字输入 (辅助) ═══ */
#input-area{
    position:fixed;z-index:5;
    bottom:env(safe-area-inset-bottom,0);
    left:0;right:0;
    padding:8px 32px 24px;
    display:flex;align-items:center;
    gap:8px;
    background:linear-gradient(to bottom,transparent 0%,rgba(20,22,28,0.5) 30%,rgba(20,22,28,0.95) 100%);
    pointer-events:none;
}
#input-area.active{pointer-events:auto}

#input-wrap{
    flex:1;position:relative;
    pointer-events:auto;
    display:flex;align-items:center;
}
#input-wrap input{
    width:100%;
    background:transparent;
    border:none;padding:10px 0;
    color:var(--text-primary);
    font-size:14px;font-weight:350;
    font-family:inherit;outline:none;
    letter-spacing:0.3px;
    caret-color:rgba(126,212,204,0.5);
}
#input-wrap input::placeholder{
    color:var(--text-dim);opacity:0.3;
    font-weight:300;letter-spacing:0.5px;
}
#input-wrap input::selection{
    background:rgba(126,212,204,0.1);
}

#input-line{
    position:absolute;bottom:0;left:0;right:0;
    height:1px;
    background:var(--glass-border);
    transition:all 0.5s cubic-bezier(0.4,0,0.2,1);
}
#input-wrap input:focus ~ #input-line{
    background:linear-gradient(90deg,transparent 0%,rgba(126,212,204,0.2) 20%,rgba(126,212,204,0.2) 80%,transparent 100%);
}

#send-btn{
    background:transparent;border:none;
    color:rgba(126,212,204,0.5);font-size:12px;
    letter-spacing:0.8px;font-weight:400;font-family:inherit;
    cursor:pointer;opacity:0;
    transition:all 0.4s;padding:6px 0 6px 8px;
    pointer-events:none;
}
#send-btn.visible{
    opacity:1;pointer-events:auto;
}

/* ═══ STATS — 极简调试信息 ═══ */
#stats{
    position:fixed;z-index:10;
    bottom:100px;left:24px;
    font-size:9px;font-family:var(--font);
    color:var(--text-dim);opacity:0;
    transition:opacity 0.5s;pointer-events:none;
    line-height:1.8;letter-spacing:0.3px;
}
#stats.visible{opacity:1}

/* ═══ RESPONSIVE ═══ */
@media(max-width:480px){
    #chat{padding:40px 20px 0;bottom:160px}
    .msg{max-width:85%}
    .msg-inner{font-size:14px;padding:10px 14px}
    #mic-wrap{bottom:calc(env(safe-area-inset-bottom,0) + 80px)}
    #mic-btn{width:64px;height:64px;font-size:20px}
    #mic-ring{width:80px;height:80px}
    #input-area{padding:6px 20px 20px}
    #orb-container{bottom:120px;width:140px;height:140px}
    #orb-container.idle{bottom:50px}
}

/* ═══ SAFE TRANSITIONS ═══ */
#chat,.msg,.msg-inner,#orb-container,#input-area,#mic-wrap,#mic-btn{will-change:transform,opacity}
</style>
</head>
<body>

<!-- SCENE BACKGROUND -->
<div id="scene"></div>

<!-- PARTICLES -->
<div id="particles"></div>

<!-- STATUS DOT -->
<div id="status" class="always">
    <div id="status-dot"></div>
    <span id="status-text">OFFLINE</span>
    <span id="ha-status"></span>
    <button id="diag-btn" title="系统诊断">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </button>
</div>

<!-- DIAGNOSTICS PANEL -->
<div id="diag-panel">
    <div id="diag-header">
        <span>系统诊断</span>
        <button id="diag-close">✕</button>
    </div>
    <div id="diag-summary">
        <span id="diag-summary-text">点击运行检查</span>
    </div>
    <div id="diag-results"></div>
    <div id="diag-actions">
        <button id="diag-run-full">全量诊断</button>
        <button id="diag-run-quick">快速诊断</button>
    </div>
</div>

<!-- TIME -->
<div id="time"></div>

<!-- ORB -->
<div id="orb-container" class="idle">
    <div id="orb"></div>
</div>

<!-- CHAT -->
<div id="chat"></div>

<!-- VOICE METER -->
<div id="meter"></div>

<!-- STATS -->
<div id="stats"></div>

<!-- MIC BUTTON — 大号居中 -->
<div id="mic-wrap">
    <button id="mic-btn">◉</button>
    <div id="mic-ring"></div>
</div>

<!-- INPUT — 文字输入 (辅助) -->
<div id="input-area">
    <div id="input-wrap">
        <input type="text" id="text-input" placeholder="消息" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div id="input-line"></div>
    </div>
    <button id="send-btn">发送</button>
</div>

<script>
// ═══ CONFIG ═══
const WS_URL = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;

// ═══ DIAGNOSTICS ═══
const diagBtn = document.getElementById('diag-btn');
const diagPanel = document.getElementById('diag-panel');
const diagClose = document.getElementById('diag-close');
const diagResults = document.getElementById('diag-results');
const diagSummaryText = document.getElementById('diag-summary-text');

diagBtn.onclick = () => diagPanel.classList.add('open');
diagClose.onclick = () => diagPanel.classList.remove('open');
diagPanel.onclick = e => { if(e.target===diagPanel) diagPanel.classList.remove('open'); };

document.getElementById('diag-run-full').onclick = () => runDiag('full');
document.getElementById('diag-run-quick').onclick = () => runDiag('quick');

async function runDiag(mode){
    const btn = mode==='full'
        ? document.getElementById('diag-run-full')
        : document.getElementById('diag-run-quick');
    btn.disabled = true;
    btn.textContent = '检查中...';
    diagSummaryText.textContent = '正在运行诊断...';
    diagResults.innerHTML = '<div class="diag-item" style="justify-content:center;color:var(--text-dim);padding:24px">检查中…</div>';

    try{
        const res = await fetch(`/api/diagnostics/${mode==='quick'?'quick':''}`);
        const data = await res.json();
        renderDiag(data);
    }catch(e){
        diagSummaryText.textContent = '⚠ 诊断请求失败';
        diagResults.innerHTML = '<div class="diag-item" style="justify-content:center;color:var(--text-dim);padding:24px">无法连接服务器</div>';
    }finally{
        btn.disabled = false;
        btn.textContent = mode==='full' ? '全量诊断' : '快速诊断';
    }
}

function renderDiag(data){
    const s = data.summary || {};
    diagSummaryText.textContent = "✓ " + (s.passed||0) + "  ⚠ " + (s.warnings||0) + "  ✕ " + (s.errors||0) + "  (" + (s.total_duration_ms||0).toFixed(0) + "ms)";

    diagResults.innerHTML = "";
    const results = data.results || [];
    for(const item of results){
        const iconMap = {ok:"✓", warn:"⚠", error:"✕", skip:"—"};
        const row = document.createElement("div");
        row.className = "diag-item";
        const icon = iconMap[item.status] || "?";
        row.innerHTML = '<div class="diag-icon ' + item.status + '">' + icon + '</div>'
            + '<div class="diag-body"><div class="diag-name">' + escapeHtml(item.name) + '</div>'
            + '<div class="diag-msg">' + escapeHtml(item.message) + '</div></div>'
            + '<div class="diag-time">' + item.duration_ms.toFixed(0) + 'ms</div>';
        diagResults.appendChild(row);
    }
    diagResults.scrollTop = 0;
}

function escapeHtml(s){
    if(!s) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ═══ WS ═══
let ws = null;
let isConnected = false;
let isRecording = false;
let reconnectTimer = null;
let pingTimer = null;

function connect(){
    if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}
    try{ws=new WebSocket(WS_URL)}catch(e){return scheduleReconnect()}
    ws.binaryType='arraybuffer';

    ws.onopen=()=>{
        isConnected=true;
        statusEl.classList.remove('always');
        statusEl.classList.add('visible');
        statusDot.className='online';
        statusText.textContent='ONLINE';
        inputArea.classList.add('active');
        orbContainer.className='idle';
        setTimeout(()=>{if(!chat.children.length)info('你好')},500);
        pingTimer=setInterval(()=>{try{ws.send(JSON.stringify({type:'ping'}))}catch(e){}},25000);
        checkHA();
    };

    ws.onclose=()=>{
        isConnected=false;
        statusDot.className='offline';
        statusText.textContent='OFFLINE';
        inputArea.classList.remove('active');
        orbContainer.className='idle';
        if(pingTimer){clearInterval(pingTimer);pingTimer=null}
        stopRec();
        scheduleReconnect();
    };

    ws.onmessage=e=>{
        if(typeof e.data==='string'){
            try{handleMsg(JSON.parse(e.data))}catch(_){}
        }else{
            // Binary data: TTS audio chunk
            appendAudioChunk(e.data);
        }
    };
}

function scheduleReconnect(){
    if(reconnectTimer)return;
    reconnectTimer=setTimeout(()=>{
        reconnectTimer=null;
        connect();
    },3000);
}

// ═══ MESSAGE HANDLER ═══
function handleMsg(msg){
    switch(msg.type){
        case 'connected':
            info('Aria · v'+msg.version);
            break;

        case 'llm_start':
            orbContainer.className='thinking';
            statsEl.classList.add('visible');
            statsEl.textContent='→';
            // 始终创建 bot 消息框, 后续 llm_token 会填充内容
            addBotMsg(msg.text || '');
            break;

        case 'llm_token':
            // 流式字幕追加到最后一条 bot 消息
            if(!window._botText) window._botText = '';
            window._botText += msg.text;
            if(lastBotMsgEl){
                const inner = lastBotMsgEl.querySelector('.msg-inner');
                if(inner){
                    // 保留 label, 替换文本内容
                    const label = inner.querySelector('.label');
                    inner.innerHTML = '';
                    if(label) inner.appendChild(label);
                    inner.appendChild(document.createTextNode(window._botText));
                }
            }
            scrollBottom();
            break;

        case 'llm_end':
            orbContainer.className='idle';
            removeTyping();
            statsEl.classList.remove('visible');
            if(lastBotMsgEl){
                lastBotMsgEl.style.opacity='1';
                // 用完整文本替换流式内容
                const fullText = msg.text || window._botText || '';
                if(fullText) {
                    window._botText = fullText;
                    const inner = lastBotMsgEl.querySelector('.msg-inner');
                    if(inner){
                        const label = inner.querySelector('.label');
                        inner.innerHTML = '';
                        if(label) inner.appendChild(label);
                        inner.appendChild(document.createTextNode(fullText));
                    }
                }
            }
            window._botText = '';
            break;

        case 'tts_start':
            orbContainer.className='speaking';
            // 开始收集音频块
            if(msg.format === 'mp3') {
                startStreamAudio();
            } else {
                startStreamAudio();
            }
            break;

        case 'tts_end':
            orbContainer.className='idle';
            endStreamAudio();
            break;

        case 'listening':
            orbContainer.className='listening';
            info('聆听中');
            break;

        case 'processing':
            orbContainer.className='thinking';
            addTyping();
            break;

        case 'error':
            info('⚠ '+msg.message);
            orbContainer.className='idle';
            removeTyping();
            break;

        case 'network_status':
            // 网络状态通知
            if(msg.online){
                statusDot.className='online';
                statusText.textContent='ONLINE';
                statusEl.classList.add('visible');
            } else {
                statusDot.className='offline';
                statusText.textContent='OFFLINE';
                statusEl.classList.add('visible');
                info('⚠ 网络不可用, 使用离线模式');
            }
            break;

        case 'info':
            info(msg.message||msg.text||'');
            break;

        case 'push':
            addBotMsg(msg.text);
            break;
    }
}

// ═══ TTS AUDIO QUEUE — 队列化顺序播放, 防止重叠 ═══
let ttsSegmentChunks = [];  // 当前 TTS 段的音频块缓存
let ttsPlayQueue = [];      // 待播放队列 [{url, blob}]
let ttsPlaying = false;     // 是否有音频正在播放

function stopStreamAudio(){
    // 中断当前播放, 清空所有队列
    ttsSegmentChunks = [];
    ttsPlayQueue = [];
    ttsPlaying = false;
}

function startStreamAudio(){
    ttsSegmentChunks = [];
}

function appendAudioChunk(data){
    // 收集当前段的音频块
    ttsSegmentChunks.push(new Uint8Array(data));
}

function endStreamAudio(){
    if(ttsSegmentChunks.length === 0) return;
    // 合并为单个 Blob, 加入播放队列
    var len = 0;
    for(var i = 0; i < ttsSegmentChunks.length; i++) {
        len += ttsSegmentChunks[i].length;
    }
    var merged = new Uint8Array(len);
    var offset = 0;
    for(var i = 0; i < ttsSegmentChunks.length; i++) {
        merged.set(ttsSegmentChunks[i], offset);
        offset += ttsSegmentChunks[i].length;
    }
    var blob = new Blob([merged], {type: 'audio/mpeg'});
    var url = URL.createObjectURL(blob);
    ttsPlayQueue.push({url: url});
    ttsSegmentChunks = [];
    // 如果没有在播放, 启动
    if(!ttsPlaying) {
        ttsPlayNext();
    }
}

function ttsPlayNext(){
    if(ttsPlayQueue.length === 0) {
        ttsPlaying = false;
        return;
    }
    ttsPlaying = true;
    var item = ttsPlayQueue.shift();
    var audio = new Audio(item.url);
    audio.volume = 1.0;
    audio.onended = function(){
        URL.revokeObjectURL(item.url);
        ttsPlayNext();
    };
    audio.onerror = function(){
        console.warn('TTS segment error');
        URL.revokeObjectURL(item.url);
        ttsPlayNext();
    };
    audio.play().catch(function(e){
        console.warn('TTS play blocked:', e);
        URL.revokeObjectURL(item.url);
        ttsPlayNext();
    });
}

// ═══ RECORDING — 浏览器语音识别 (Chrome 内置, 离线) ═══
const meterBars = [];
for(let i=0;i<28;i++){
    const b=document.createElement('div');
    b.className='bar';
    meter.appendChild(b);
    meterBars.push(b);
}

let recognition = null;

function getSpeechRecognition(){
    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Ctor) return null;
    const r = new Ctor();
    r.continuous = false;
    r.interimResults = true;
    r.lang = 'zh-CN';
    return r;
}

function updateMeter(rms){
    const h=Math.min(20,Math.max(1,rms*40));
    meterBars.forEach((b,i)=>{
        const rh=h*(0.3+Math.random()*0.7);
        b.style.height=rh+'px';
        b.style.opacity=rh>3?'0.5':'0.1';
    });
}

let micCooldown = false;
async function toggleMic(){
    if(!isConnected || micCooldown) return;
    micCooldown = true;
    setTimeout(() => { micCooldown = false; }, 300);
    isRecording?stopRec():startRec();
}

async function startRec(){
    if(isRecording){ stopRec(); return; }
    if(!recognition) recognition = getSpeechRecognition();
    if(!recognition){ info('浏览器不支持语音识别，请用 Chrome'); return; }
    
    isRecording = true;
    micBtn.classList.add('recording'); micBtn.textContent = '◼';
    meter.classList.add('active');
    orbContainer.className = 'listening';
    
    let finalText = '';
    
    recognition.onresult = e => {
        for(let i = e.resultIndex; i < e.results.length; i++){
            const r = e.results[i];
            if(r.isFinal) finalText += r[0].transcript;
        }
        updateMeter(0.3 + Math.random() * 0.4);
    };
    
    recognition.onerror = e => {
        if(e.error === 'no-speech') return;
        info('语音识别出错: ' + e.error);
        stopRec();
    };
    
    recognition.onend = () => {
        if(finalText.trim()){
            ws.send(JSON.stringify({type:'text', text:finalText.trim()}));
            addMsg('user', finalText.trim());
        }
        stopRec();
    };
    
    try{
        recognition.start();
    }catch(e){
        if(e.name === 'InvalidStateError' && e.message.includes('already')){
            try{ recognition.stop(); }catch(e2){}
            setTimeout(() => {
                try{ recognition.start(); }catch(e3){ stopRec(); }
            }, 200);
        } else {
            info('语音启动失败: ' + e.message);
            stopRec();
        }
    }
}

function stopRec(){
    if(!isRecording && !recognition) return;
    isRecording = false;
    micBtn.classList.remove('recording'); micBtn.textContent = '◉';
    meter.classList.remove('active'); updateMeter(0);
    orbContainer.className = 'idle';
    
    if(recognition){
        try{ recognition.stop(); }catch(e){}
        try{ recognition.abort(); }catch(e){}
    }
}

// ═══ TEXT INPUT ═══
function sendText(){
    const t=textInput.value.trim();
    if(!t||!isConnected)return;
    ws.send(JSON.stringify({type:'text',text:t}));
    addMsg('user',t);
    textInput.value='';
    sendBtn.classList.remove('visible');
    textInput.style.display='block';
}
function handleKey(e){
    if(e.key==='Enter')sendText();
    sendBtn.classList.toggle('visible',textInput.value.trim().length>0);
}
textInput.addEventListener('input',handleKey);
textInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendText()}});
sendBtn.addEventListener('click',sendText);

// ═══ MIC ═══
micBtn.addEventListener('click',toggleMic);

// ═══ KEYBOARD SHORTCUTS ═══
document.addEventListener('keydown',e=>{
    if(e.key===' '&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){
        e.preventDefault();toggleMic();
    }
    if(e.key==='Escape'&&isRecording)stopRec();
});

setTimeout(()=>{
    statusEl.classList.add('visible');
    timeEl.classList.add('visible');
},500);

// ═══ START ═══
connect();
